# Atlas Mobile MVP - Nginx 反向代理配置（HTTPS）
# 部署：复制到 /etc/nginx/sites-available/atlas
#       ln -s /etc/nginx/sites-available/atlas /etc/nginx/sites-enabled/
#       nginx -t && systemctl reload nginx
#
# ⚠️ 域名 api.atlas-lottery.com 为示例，需替换为实际域名
# ⚠️ SSL 证书路径为示例，替换为腾讯云 DV 证书实际路径

# HTTPS 主服务
server {
    listen 443 ssl http2;
    server_name api.atlas-lottery.com;

    # SSL 证书（腾讯云 DV）
    ssl_certificate     /etc/nginx/ssl/api.atlas-lottery.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/api.atlas-lottery.com/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 后端 FastAPI（本机 8000，不暴露公网）
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 健康检查
    location = /healthz {
        proxy_pass http://127.0.0.1:8000;
        access_log off;
    }
}

# HTTP 强制跳转 HTTPS
server {
    listen 80;
    server_name api.atlas-lottery.com;
    return 301 https://$host$request_uri;
}
